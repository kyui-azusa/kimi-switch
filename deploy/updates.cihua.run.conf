server {
    listen 80;
    listen [::]:80;
    server_name updates.cihua.run;

    access_log /var/log/nginx/updates.cihua.run.access.log main;
    error_log /var/log/nginx/updates.cihua.run.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name updates.cihua.run;

    root /var/www/updates.cihua.run;
    index index.html;
    charset utf-8;
    autoindex off;

    ssl_certificate /etc/letsencrypt/live/updates.cihua.run/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/updates.cihua.run/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/updates.cihua.run.access.log main;
    error_log /var/log/nginx/updates.cihua.run.error.log warn;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
    }

    location = /kimi-switch/latest.json {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "no-cache, max-age=0" always;
    }

    location ^~ /kimi-switch/releases/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        return 404;
    }
}
