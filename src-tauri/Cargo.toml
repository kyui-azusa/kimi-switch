[package]
name = "kimi-switch-desktop"
version = "0.2.13"
description = "Local Kimi Code account switcher and proxy"
authors = ["KimiSwitch contributors"]
edition = "2021"

[lib]
name = "kimi_switch_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-process = "2.3"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
